meta:
  title: 技术中台组织架构
  description: 基础设施、应用平台、数据与算法四大方向的领域负责人、核心成员与人力缺口
  version: "1.0.0"

theme: hearthstone

domains:
  - name: infra
    displayName: 基础设施
    lead: torvalds
    color: "#4a3113"
    description: 内核、网络、计算与存储底座
    subdomains:
      - name: compute
        displayName: 计算与调度
        lead: gvanrossum
        gaps:
          - role: SRE 工程师
            count: 2
            priority: high
            note: 支撑多活容灾演练
      - name: storage
        displayName: 存储
        lead: antirez
        members: [pcarrier]
        gaps:
          - role: 分布式存储专家
            count: 1
            priority: critical
            note: 自研 KV 引擎缺主力

  - name: platform
    displayName: 应用平台
    lead: dhh
    color: "#3f2a4a"
    description: 研发框架、CI/CD 与服务治理
    subdomains:
      - name: devex
        displayName: 研发效能
        lead: matz
        members: [jeresig]
        gaps:
          - role: 构建工程师
            count: 1
            priority: medium

  - name: data
    displayName: 数据
    lead: mrocklin
    color: "#13424a"
    description: 数仓、实时计算与指标体系
    subdomains:
      - name: warehouse
        displayName: 数仓与建模
        lead: wesm

  - name: frontend
    displayName: 前端
    lead: gaearon
    members: [yyx990803]
    color: "#1a3a4a"
    description: Web 架构、组件体系与渲染性能

  - name: algo
    displayName: 算法
    lead: karpathy
    members: []
    color: "#4a1f2a"
    description: 推荐、NLP 与模型工程
    gaps:
      - role: 推荐算法工程师
        count: 3
        priority: critical
        note: 新业务线冷启动

people:
  - id: torvalds
    name: Linus Torvalds
    title: 首席架构师
    homeDomain: infra
    avatar: github:torvalds
    tags: [Kernel, C, 分布式]
    rarity: legendary

  - id: gvanrossum
    name: Guido van Rossum
    title: 资深技术专家
    homeDomain: compute
    avatar: github:gvanrossum
