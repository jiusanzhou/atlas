    title: 平台技术总监
    homeDomain: platform
    avatar: github:dhh
    tags: [Rails, 架构, 研发效能]
    rarity: legendary
    comment: 平台总监。风格强硬，落地能力强。

  - id: matz
    name: Yukihiro Matsumoto
    title: 研发效能负责人
    homeDomain: devex
    avatar: github:matz
