  - id: karpathy
    name: Andrej Karpathy
    title: 实时计算负责人
    homeDomain: streaming
    avatar: github:karpathy
    tags: [深度学习, 流处理, 模型工程]
    rarity: legendary
    comment: |
      实时计算负责人，AI 背景强。

      ⚠️ **需要关注**：流计算工程师缺口 2 人，招聘周期长。

      | 方向 | 状态 |
      | --- | --- |
      | 实时指标 | 进行中 |
      | 特征平台 | ~~暂缓~~ |
