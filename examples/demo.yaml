meta:
  title: 技术中台组织架构
  description: 基础设施、应用平台与数据三大方向的领域负责人、核心成员与人力缺口
  version: "1.5.0"

theme: hearthstone

domains:
  - name: infra
    displayName: 基础设施
    lead: torvalds
    members: [pcarrier]
    color: "#4a3113"
    description: 内核、网络、计算与存储底座
    subdomains:
      - name: compute
        displayName: 计算与调度
        lead: gvanrossum
        gaps:
          - role: SRE 工程师
            count: 2
            priority: high
            note: 支撑多活容灾演练
            comment: |
              **岗位要求**

              - 3+ 年大规模集群 SRE 经验
              - 熟悉 Kubernetes / Prometheus / 混沌工程
              - 有多活容灾演练的实操经历

              **加分项**

              - 写过 operator 或调度器扩展
              - `eBPF` 可观测性背景
      - name: storage
        displayName: 存储
        lead: antirez
        description: 自研 KV 与对象存储
        subdomains:
          - name: objectstore
            displayName: 对象存储
            lead: bcantrill
            gaps:
              - role: 分布式存储专家
                count: 1
                priority: critical
                note: 自研纠删码引擎缺主力
                comment: |
                  **必须具备**

                  | 方向 | 要求 |
                  | --- | --- |
                  | 纠删码 | Reed-Solomon 工程落地经验 |
                  | 一致性 | Raft / Paxos 实现级理解 |
                  | 语言 | Rust 或 C++ 熟练 |

                  ~~可接受纯理论背景~~ —— 需要能直接下场写引擎。
          - name: blockstore
            displayName: 块存储
            lead: kelseyhightower
      - name: network
        displayName: 网络
        lead: bhorowitz
        gaps:
          - role: 网络工程师
            count: 1
            priority: medium

  - name: platform
    displayName: 应用平台
    lead: dhh
    color: "#3f2a4a"
    description: 研发框架、CI/CD 与服务治理
    subdomains:
      - name: web
        displayName: Web
        lead: gaearon
        members: [yyx990803]
        description: 组件体系与渲染性能
      - name: mobile
        displayName: 移动端
        # 负责人空缺：leadGap 与 lead 互斥，这里等招
        leadGap:
          role: 移动端负责人
          priority: critical
          note: 缺 5+ 年 iOS 深度经验
          comment: |
            **岗位要求**

            - 5+ 年 iOS/Android 一线开发
            - 有过 1000w+ DAU App 架构经验
            - 熟悉热更新 / 灰度发布 / 崩溃治理

            **加分项**

            - Flutter / RN 跨端背景
            - 团队管理经验（10+ 人）

            > 目前由 dhh 代管，最迟 Q3 需到位。
        members: [jeresig]
        gaps:
          - role: iOS 工程师
            count: 2
            priority: high
            note: 支撑短视频侧渲染
            comment: |
              - Metal / OpenGL 渲染背景
              - AV Foundation 熟练
              - 了解 `VideoToolbox` 硬编解码链路
      - name: devex
        displayName: 研发效能
        lead: matz
        gaps:
          - role: 构建工程师
            count: 1
            priority: medium

  - name: data
    displayName: 数据
    lead: mrocklin
    color: "#13424a"
    description: 数仓、实时计算与指标体系
    subdomains:
      - name: warehouse
        displayName: 数仓与建模
        lead: wesm
      - name: streaming
        displayName: 实时计算
        lead: karpathy
        gaps:
          - role: 流计算工程师
            count: 2
            priority: critical
            note: 实时指标链路待补齐

people:
  - id: torvalds
    name: Linus Torvalds
    title: 首席架构师
    homeDomain: infra
    avatar: github:torvalds
    tags: [Kernel, C, 分布式]
    rarity: legendary
    comment: |
      **强项**：内核方向的定海神针，架构判断稳。
      **风险**：对分布式存储的介入度低，需要 antirez 补位。

      最近关注：

      - RISC-V 生态跟进
      - 内核可观测性能力建设
      - 多活容灾的内核侧支撑

  - id: gvanrossum
    name: Guido van Rossum
    title: 资深技术专家
    homeDomain: compute
    avatar: github:gvanrossum
    tags: [Python, 调度, 编译器]
    rarity: legendary

  - id: antirez
    name: Salvatore Sanfilippo
    title: 存储负责人
    homeDomain: storage
    avatar: github:antirez
    tags: [Redis, C, 存储引擎]
    rarity: epic
    lendTo:
      - domain: streaming
        ratio: 0.3
        role: 实时存储选型
    comment: |
      存储方向 tech lead，正在 lead 自研 KV（代号 `atlas-kv`）。

      - 借调 30% 给实时计算做存储选型
      - 长期计划：把对象存储纠删码方案落地

      > 注意：借调比例已到上限，不宜再加新方向。

  - id: bcantrill
    name: Bryan Cantrill
    title: 对象存储负责人
    homeDomain: objectstore
    avatar: github:bcantrill
    tags: [Rust, 系统, 可观测性]
    rarity: epic

  - id: kelseyhightower
    name: Kelsey Hightower
    title: 块存储负责人
    homeDomain: blockstore
    avatar: github:kelseyhightower
    tags: [Kubernetes, 运维]

  - id: bhorowitz
    name: Ben Horowitz
    title: 网络负责人
