  - id: jeresig
    name: John Resig
    title: 移动端资深工程师
    homeDomain: mobile
    avatar: github:jeresig
    tags: [JavaScript, 测试]

  - id: mrocklin
    name: Matthew Rocklin
    title: 数据平台负责人
    homeDomain: data
    avatar: github:mrocklin
