meta:
  title: 技术中台组织架构
  description: 基础设施、应用平台与数据三大方向的领域负责人、核心成员与人力缺口
  version: "1.1.0"

theme: hearthstone

domains:
  - name: infra
    displayName: 基础设施
    lead: torvalds
    members: [pcarrier]
    color: "#4a3113"
    description: 内核、网络、计算与存储底座
    subdomains:
      - name: compute
        displayName: 计算与调度
        lead: gvanrossum
        gaps:
          - role: SRE 工程师
            count: 2
            priority: high
            note: 支撑多活容灾演练
      - name: storage
        displayName: 存储
        lead: antirez
        description: 自研 KV 与对象存储
        subdomains:
          - name: objectstore
            displayName: 对象存储
            lead: bcantrill
            gaps:
              - role: 分布式存储专家
                count: 1
                priority: critical
                note: 自研纠删码引擎缺主力
          - name: blockstore
            displayName: 块存储
            lead: kelseyhightower
      - name: network
        displayName: 网络
        lead: bhorowitz
        gaps:
          - role: 网络工程师
            count: 1
            priority: medium

  - name: platform
    displayName: 应用平台
    lead: dhh
    color: "#3f2a4a"
    description: 研发框架、CI/CD 与服务治理
    subdomains:
      - name: web
        displayName: Web
        lead: gaearon
        members: [yyx990803]
        description: 组件体系与渲染性能
      - name: mobile
        displayName: 移动端
        lead: jeresig
        gaps:
          - role: iOS 工程师
            count: 2
            priority: high
      - name: devex
        displayName: 研发效能
        lead: matz
        gaps:
          - role: 构建工程师
            count: 1
            priority: medium

  - name: data
    displayName: 数据
    lead: mrocklin
    color: "#13424a"
    description: 数仓、实时计算与指标体系
    subdomains:
      - name: warehouse
        displayName: 数仓与建模
        lead: wesm
      - name: streaming
        displayName: 实时计算
        lead: karpathy
        gaps:
          - role: 流计算工程师
            count: 2
            priority: critical
            note: 实时指标链路待补齐

people:
  - id: torvalds
    name: Linus Torvalds
    title: 首席架构师
    homeDomain: infra
    avatar: github:torvalds
    tags: [Kernel, C, 分布式]
    rarity: legendary

  - id: gvanrossum
    name: Guido van Rossum
    title: 资深技术专家
    homeDomain: compute
    avatar: github:gvanrossum
    tags: [Python, 调度, 编译器]
    rarity: legendary

  - id: antirez
    name: Salvatore Sanfilippo
    title: 存储负责人
    homeDomain: storage
    avatar: github:antirez
    tags: [Redis, C, 存储引擎]
    rarity: epic
    lendTo:
      - domain: streaming
        ratio: 0.3
        role: 实时存储选型

  - id: bcantrill
    name: Bryan Cantrill
    title: 对象存储负责人
    homeDomain: objectstore
    avatar: github:bcantrill
